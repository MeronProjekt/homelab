services:
  hermes:
    image: python:3.12-slim
    container_name: hermes_agent
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./app:/app
      - ./logs:/app/logs
      - ./data:/app/data
      - ./app/.ssh:/root/.ssh:ro
    env_file:
      - .env
    command: >
      sh -c "apt-get update && apt-get install -y openssh-client --no-install-recommends &&
             pip install anthropic requests --quiet &&
             python main.py"
    networks:
      - hermes_net
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

  mcp_server:
    image: node:20-slim
    container_name: hermes_mcp
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8081:8080"
    volumes:
      - /opt/mcp:/app
      - /opt/hermes/app/.ssh:/root/.ssh:ro
    command: >
      sh -c "npm install express &&
             node server.js"
    networks:
      - hermes_net

networks:
  hermes_net:
    driver: bridge
